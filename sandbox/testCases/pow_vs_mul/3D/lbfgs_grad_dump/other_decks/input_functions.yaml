%YAML 1.1
---
ANONYMOUS:
  Functions:
    # Center source block: out-of-plane (z) Gaussian-modulated current
    # localized near origin in x, y, and z. Pulse parameters match the
    # 1D / 2D tests; (abs(z)<zsrc) added to localize in z for 3D.
    eblock-1_1_1:
      current x: '0'
      current y: '0'
      current z: 'gt*exp(-2*timebub*(t<toff))*(abs(x)<xsrc)*(abs(y)<ysrc)*(abs(z)<zsrc)'
      permittivity: '8.854187817e-12'
      permeability: '1.2566370614e-6'
      fc: '75.0e12'
      fb: '40.0e12'
      bs: '2.3548'
      sigmaJ: fb/bs
      gt: 'cos(2*pi*fc*(t-toff))'
      timebub: '(pi*sigmaJ*(t-toff))*(pi*sigmaJ*(t-toff))'
      toff: '50.0e-15'
      xsrc: '0.404e-6'
      ysrc: '0.404e-6'
      zsrc: '0.404e-6'

    # Control face-center blocks (6): current = curl(ctrl_current).
    eblock-0_1_1:
      current x: 'curl(ctrl_current)[x]'
      current y: 'curl(ctrl_current)[y]'
      current z: 'curl(ctrl_current)[z]'
      permittivity: '8.854187817e-12'
      permeability: '1.2566370614e-6'
    eblock-2_1_1:
