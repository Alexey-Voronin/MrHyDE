%YAML 1.1
---
ANONYMOUS:
  debug level: 0
  verbosity: 0
  Mesh input file: meshes/mesh_r2.yaml
  Physics:
    modules: maxwell
    active controls: true
    Initial conditions:
      scalar data: true
      E: 0.0
      B: 0.0
    Dirichlet conditions:
      scalar data: false
      Ex:
        left: '0.0'
        right: '0.0'
        top: '0.0'
        bottom: '0.0'
      Ey:
        left: '0.0'
        right: '0.0'
        top: '0.0'
        bottom: '0.0'
      Ez:
        left: '0.0'
        right: '0.0'
        top: '0.0'
        bottom: '0.0'
    Mass weights:
      E: 1.0
      B: 1.0
    Norm weights:
      E: permittivity
      B: 1/permeability
  Discretization:
    order:
      E: 1
      B: 1
    quadrature: 2
    side quadrature: 2
  Parameters input file: other_decks/input_params.yaml
  Functions input file: other_decks/input_functions.yaml
  Solver:
    solver: 'transient'
    transient BDF order: 1
    transient Butcher tableau: DIRK-1,2
    workset size: 100
    final time: 5.0e-13
    number of steps: 2000
    assembly partitioning: sequential
    use basis database: false
    use mass database: false
    database TOL: 1.0e-13
    linear TOL: 1.0e-14
    max linear iters: 200
    nonlinear TOL: 1.0e-07
    max nonlinear iters: 1
    use preconditioner: true
    preconditioner type: Ifpack2
    preconditioner variant: RELAXATION
    right preconditioner: true
    use direct solver: false
    reuse preconditioner: true
    reuse Jacobian: true
    preconditioner reuse type: full
    Belos implicit residual scaling: Norm of Initial Residual
    storage proportion: 1.0
    Belos solver: 'BiCGStab'
    enable autotune: true
    Preconditioner Settings:
      "relaxation: type": "Jacobi"
      "relaxation: damping factor": 0.5
      "relaxation: backward mode": false
      "relaxation: sweeps": 2
    dump jacobian: false
  Analysis input file: rol_decks/rol_r2_mul.yaml
  Postprocess:
    write solution: true #false
    write frequency: 1
    exodus write frequency: 1
    output file: opt-output/output
    compute objective: true
    compute response: false
    compute weighted norm: false
    compute sensitivities: false
    Objective functions:
      EM Energy:
        type: integrated control
        function: '0.5*permittivity*(E[x]*E[x]+E[y]*E[y]+E[z]*E[z]) + 0.5/permeability*(B[x]*B[x]+B[y]*B[y]+B[z]*B[z])'
        weight: 1.0e35
        blocks: 'eblock-0_0_0 eblock-0_2_0 eblock-2_0_0 eblock-2_2_0'
      RegObj:
        type: integrated control
        function: '0.0'
        weight: 0.0
        blocks: 'eblock-0_1_0 eblock-1_0_0 eblock-2_1_0 eblock-1_2_0'
        Regularization functions:
          l2reg:
            type: integrated
            location: volume
            function: '0.5*(ctrl_current[x]*ctrl_current[x])+0.5*(ctrl_current[y]*ctrl_current[y])+0.5*(ctrl_current[z]*ctrl_current[z])'
            weight: 1.0e5
          curlreg:
            type: integrated
            location: volume
            function: '0.5*(curl(ctrl_current)[x]*curl(ctrl_current)[x])+0.5*(curl(ctrl_current)[y]*curl(ctrl_current)[y])+0.5*(curl(ctrl_current)[z]*curl(ctrl_current)[z])'
            weight: 1.0e5
    Extra cell fields:
      Jx: 'current x'
      Jy: 'current y'
      Jz: 'current z'
      ctrlJx: 'curl(ctrl_current)[x]'
      ctrlJy: 'curl(ctrl_current)[y]'
      ctrlJz: 'curl(ctrl_current)[z]'
      conductivity: sigma
      em_energy: '1.0e35 * (0.5*permittivity*(E[x]*E[x]+E[y]*E[y]+E[z]*E[z]) + 0.5/permeability*(B[x]*B[x]+B[y]*B[y]+B[z]*B[z]))'
...
