%YAML 1.1
---
# Cavity [0,1]x[0,1]x[0,0.5], periodic in z, natural on the x and y faces, eps = mu = 1.

ANONYMOUS:
  Mesh:
    dimension: 3
    shape: hex
    xmin: 0.0
    xmax: 1.0
    ymin: 0.0
    ymax: 1.0
    zmin: 0.0
    zmax: 0.5
    NX: 8
    NY: 8
    NZ: 4
    blocknames: eblock-0_0_0
    Periodic BCs:
      Count: 1
      Periodic Condition 1: 'xy-all 1e-10: front;back'

  Physics:
    eblock-0_0_0:
      modules: maxwell
      assemble boundary terms: false
      Initial conditions:
        "E[x]": "0.0"
        "E[y]": "0.0"
        "E[z]": "exp(-((x-0.37)^2+(y-0.61)^2)/0.02)"
        "B[x]": "0.0"
        "B[y]": "0.0"
        "B[z]": "0.0"

  Discretization:
    eblock-0_0_0:
      order:
        E: 1
        B: 1
      quadrature: 2
      side quadrature: 2

  Functions:
    current x: "0.0"
    current y: "0.0"
    current z: "0.0"
    permittivity: "1.0"
    permeability: "1.0"

  Analysis:
    analysis type: forward

  Postprocess:
    write solution: false
    compute errors: false
    compute integrated quantities: true
    eblock-0_0_0:
      Integrated quantities:
        electric_energy:
          integrand: "0.5*(E[x]^2 + E[y]^2 + E[z]^2)"
          location: "volume"
        magnetic_energy:
          integrand: "0.5*(B[x]^2 + B[y]^2 + B[z]^2)"
          location: "volume"
        total_energy:
          integrand: "0.5*(E[x]^2 + E[y]^2 + E[z]^2) + 0.5*(B[x]^2 + B[y]^2 + B[z]^2)"
          location: "volume"
...
