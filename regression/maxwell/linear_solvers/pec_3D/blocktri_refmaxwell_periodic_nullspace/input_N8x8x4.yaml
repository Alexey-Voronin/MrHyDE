%YAML 1.1
---
ANONYMOUS:
  debug level: 0
  verbosity: 10
  disable timers: true

  Mesh input file: input_common_periodic.yaml
  Physics input file: input_common_periodic.yaml
  Discretization input file: input_common_periodic.yaml
  Functions input file: input_common_periodic.yaml
  Solver input file: ../input_solver_common.yaml
  Analysis input file: input_common_periodic.yaml
  Postprocess input file: input_common_periodic.yaml

  Mesh:
    NX: 8
    NY: 8
    NZ: 4

  Solver:
    number of steps: 2
    preconditioner type: block triangular
    Block Triangular Settings:
      variable groups:
        B: 'B'
        E: 'E'
      schur target: E
      approximation type: diag
      diag use lumped pivot diagonal: true
      B:
        preconditioner: AMG
        AMG Settings:
          xml param file: ../xml/amg_pivot.xml
      E:
        preconditioner: RefMaxwell
        hgrad basis name: phi_aux
        hcurl basis name: E
        RefMaxwell Settings:
          xml param file: ../xml/refmaxwell_p2v3.xml
...
