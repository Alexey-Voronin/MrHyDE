%YAML 1.1
---
# Block triangular, exact-curl Schur; adjoint sweeps scale each split to its own RHS by default.
ANONYMOUS:
  print timers: true
  Mesh input file: ../blocktri_exactcurl_adjoint/input_direct.yaml
  Physics input file: ../blocktri_exactcurl_adjoint/input_direct.yaml
  Discretization input file: ../blocktri_exactcurl_adjoint/input_direct.yaml
  Parameters input file: ../blocktri_exactcurl_adjoint/input_direct.yaml
  Functions input file: ../blocktri_exactcurl_adjoint/input_direct.yaml
  Solver input file: ../blocktri_exactcurl_adjoint/input_direct.yaml
  Analysis input file: ../blocktri_exactcurl_adjoint/input_direct.yaml
  Postprocess input file: ../blocktri_exactcurl_adjoint/input_direct.yaml
  Analysis:
    ROL2:
      General:
        FD Check Seed: 1
  Solver:
    use direct solver: false
    reuse Jacobian across sweeps: false
    max linear iters: 500
    right preconditioner: true
    Belos implicit residual scaling: Norm of Initial Residual
    Belos solver: 'Block GMRES'
    Flexible Gmres: true
    preconditioner type: block triangular
    Block Triangular Settings:
      variable groups:
        B: 'B'
        E: 'E'
      schur target: E
      approximation type: exact-curl
      triangle: full
      B:
        preconditioner: AMG
        inner krylov solver: 'Pseudo Block CG'
        inner krylov max iters: 100
        inner krylov tol: 1.0e-14
        AMG Settings:
          xml param file: ../xml/pivot_jacobi.xml
      E:
        preconditioner: RefMaxwell
        inner krylov solver: 'Pseudo Block CG'
        inner krylov max iters: 300
        inner krylov tol: 1.0e-13
        hgrad basis name: phi_aux
        hcurl basis name: E
        hgrad basis order: 1
        hcurl basis order: 1
        RefMaxwell Settings:
          xml param file: ../xml/refmaxwell_emin.xml
          'filter SM': true
...
