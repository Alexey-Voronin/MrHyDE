%YAML 1.1
---
ANONYMOUS:
  Functions:
    # Center source block: out-of-plane (z) Gaussian-modulated current
    # localized near origin. Pulse parameters match the 1D test.
    eblock-1_1_0:
      current x: '0'
      current y: '0'
      current z: 'gt*exp(-2*timebub*(t<toff))*(abs(x)<xsrc)*(abs(y)<ysrc)'
      permittivity: '8.854187817e-12'
      permeability: '1.2566370614e-6'
      fc: '75.0e12'
      fb: '40.0e12'
      bs: '2.3548'
      sigmaJ: fb/bs
      gt: 'cos(2*pi*fc*(t-toff))'
      timebub: '(pi*sigmaJ*(t-toff))*(pi*sigmaJ*(t-toff))'
      toff: '50.0e-15'
      xsrc: '0.404e-6'
      ysrc: '0.404e-6'

    # Control ring (the four edge-mid blocks): current = curl(ctrl_current),
    # matching the 1D test exactly. ctrl_current is HCURL with 3 components.
    eblock-0_1_0:
      current x: 'curl(ctrl_current)[x]'
      current y: 'curl(ctrl_current)[y]'
      current z: 'curl(ctrl_current)[z]'
      permittivity: '8.854187817e-12'
      permeability: '1.2566370614e-6'
    eblock-1_0_0:
      current x: 'curl(ctrl_current)[x]'
      current y: 'curl(ctrl_current)[y]'
      current z: 'curl(ctrl_current)[z]'
      permittivity: '8.854187817e-12'
      permeability: '1.2566370614e-6'
    eblock-2_1_0:
      current x: 'curl(ctrl_current)[x]'
      current y: 'curl(ctrl_current)[y]'
      current z: 'curl(ctrl_current)[z]'
      permittivity: '8.854187817e-12'
      permeability: '1.2566370614e-6'
    eblock-1_2_0:
      current x: 'curl(ctrl_current)[x]'
      current y: 'curl(ctrl_current)[y]'
      current z: 'curl(ctrl_current)[z]'
      permittivity: '8.854187817e-12'
      permeability: '1.2566370614e-6'

    # Corner observer/absorber blocks: cubic conductivity ramp in x and y.
    # The outer 10 um of each corner is dissipative, the inner part is vacuum.
    eblock-0_0_0:
      current x: '0'
      current y: '0'
      current z: '0'
      permittivity: '8.854187817e-12'
      permeability: '1.2566370614e-6'
      conductivity: 'alpha*xmindist*xmincut + alpha*xmaxdist*xmaxcut + alpha*ymindist*ymincut + alpha*ymaxdist*ymaxcut'
      alpha: 'max_sigma/(abs(xmaxend-xmaxstart)^3)'
      max_sigma: "1.0e4"
      xmaxd: 'abs(x-xmaxstart)'
      xmaxdist: 'xmaxd*xmaxd*xmaxd'
      xmaxcut: '(x>xmaxstart)'
      xmaxstart: '26.0e-6'
      xmaxend: '36.0e-6'
      xmind: 'abs(x-xminstart)'
      xmindist: 'xmind*xmind*xmind'
      xmincut: '(x<xminstart)'
      xminstart: '-26.0e-6'
      xminend: '-36.0e-6'
      ymaxd: 'abs(y-ymaxstart)'
      ymaxdist: 'ymaxd*ymaxd*ymaxd'
      ymaxcut: '(y>ymaxstart)'
      ymaxstart: '26.0e-6'
      ymaxend: '36.0e-6'
      ymind: 'abs(y-yminstart)'
      ymindist: 'ymind*ymind*ymind'
      ymincut: '(y<yminstart)'
      yminstart: '-26.0e-6'
      yminend: '-36.0e-6'
    eblock-0_2_0:
      current x: '0'
      current y: '0'
      current z: '0'
      permittivity: '8.854187817e-12'
      permeability: '1.2566370614e-6'
      conductivity: 'alpha*xmindist*xmincut + alpha*xmaxdist*xmaxcut + alpha*ymindist*ymincut + alpha*ymaxdist*ymaxcut'
      alpha: 'max_sigma/(abs(xmaxend-xmaxstart)^3)'
      max_sigma: "1.0e4"
