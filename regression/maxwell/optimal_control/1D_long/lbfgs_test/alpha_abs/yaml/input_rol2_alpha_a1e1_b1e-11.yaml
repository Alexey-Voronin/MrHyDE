%YAML 1.1
---
# Alpha sweep: (alpha1=10, alpha2=1e-11) -- K-suppressed
# H = 10*M + 1e-11*K  (alpha1*M ~ 1e-10, alpha2*K ~ 1e-11; M dominates)
# Similar effect to (1e11,1) but achieved by suppressing K instead of boosting M
ANONYMOUS:
  Analysis:
    analysis type: ROL2
    parameter gradient preconditioner type: sparse_direct
    hcurl alpha1: 1.0e1
    hcurl alpha2: 1.0e-11
    ROL2:
      General:
        Output Level: 2
        Disable source on final output: false
        Variable Objective Function: false
        Scale for Epsilon Active Sets: 1.0
        FD Scale: 1.0
        Do grad+hessvec check: false
        Bound Optimization Variables: false
        Inexact Objective Function: false
        Inexact Gradient: false
        Inexact Hessian-Times-A-Vector: false
        Projected Gradient Criticality Measure: false
        HessVec Precond Mode: dual
        Secant:
          Type: Limited-Memory BFGS
          Use as Preconditioner: false
          Use as Hessian: false
          Maximum Storage: 20
          Barzilai-Borwein Type: 1
          Use Default Scaling: true
          Initial Hessian Scale: 1.0e+8
        Krylov:
          Type: Conjugate Gradients
          Absolute Tolerance: 1.0e-6
          Relative Tolerance: 1.0e-2
          Iteration Limit: 20
      Step:
        Type: Line Search
        Line Search:
          Function Evaluation Limit: 20
          Sufficient Decrease Tolerance: 1.0e-04
          Initial Step Size: 1.0e-8
          User Defined Initial Step Size: false
          Accept Linesearch Minimizer: false
          Accept Last Alpha: false
          Descent Method:
            Type: Quasi-Newton
            Nonlinear CG Type: Hestenes-Stiefel
          Curvature Condition:
            Type: Null Curvature Conditions
            General Parameter: 9.0e-02
            Generalized Wolfe Parameter: 6.0e-1
          Line-Search Method:
            Type: Cubic Interpolation
            Backtracking Rate: 5.0e-01
            Bracketing Tolerance: 1.0e-8
            Path-Based Target Level:
              Target Relaxation Parameter: 1.0
              Upper Bound on Path Length: 1.0
      Status Test:
        Gradient Tolerance: 1.0e-6
        Use Relative Tolerances: true
        Constraint Tolerance: 1.0e-08
        Step Tolerance: 1.0e-50
        Iteration Limit: 120
...
