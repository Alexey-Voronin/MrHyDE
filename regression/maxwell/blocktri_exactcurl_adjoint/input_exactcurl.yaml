%YAML 1.1
---
# Block triangular, exact-curl Schur; adjoint sweeps scale each split to its own RHS by default.
ANONYMOUS:
  Mesh input file: input_direct.yaml
  Physics input file: input_direct.yaml
  Discretization input file: input_direct.yaml
  Parameters input file: input_direct.yaml
  Functions input file: input_direct.yaml
  Solver input file: input_direct.yaml
  Analysis input file: input_direct.yaml
  Postprocess input file: input_direct.yaml
  Solver:
    use direct solver: false
    reuse Jacobian across sweeps: false
    max linear iters: 500
    right preconditioner: true
    Belos implicit residual scaling: Norm of Initial Residual
    Belos solver: 'GCRODR'
    Num Blocks: 30
    Num Recycled Blocks: 20
    Maximum Restarts: 102
    preconditioner type: block triangular
    Block Triangular Settings:
      variable groups:
        B: 'B'
        E: 'E'
      schur target: E
      approximation type: exact-curl
      B:
        preconditioner: AMG
        AMG Settings:
          xml param file: ../xml/pivot_jacobi.xml
      E:
        preconditioner: RefMaxwell
        hgrad basis name: phi_aux
        hcurl basis name: E
        hgrad basis order: 1
        hcurl basis order: 1
        RefMaxwell Settings:
          xml param file: ../xml/refmaxwell_emin.xml
          'filter SM': true
...
