%YAML 1.1
---
ANONYMOUS:
  print timers: true
  Mesh input file: input_off.yaml
  Physics input file: input_off.yaml
  Discretization input file: input_off.yaml
  Parameters input file: input_off.yaml
  Functions input file: input_off.yaml
  Solver input file: input_off.yaml
  Analysis input file: input_off.yaml
  Postprocess input file: input_off.yaml
  Solver:
    use direct solver: false
    preconditioner reuse type: update
    reuse Jacobian across sweeps: true
    transient BDF order: 2
    transient Butcher tableau: BWE
    transient startup BDF order: 1
    transient startup Butcher tableau: DIRK-1,2
    transient startup steps: 2
...
